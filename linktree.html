    content="Links for Diego Ignacio Pérez Baković — Software Engineer and Applied Business Analytics student."

  <!-- Royal Athletic Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@600;700;800&display=swap"
    rel="stylesheet"
  >

  <style>
    /* =========================================================
       ROYAL ATHLETIC — LINK PAGE
       ========================================================= */

    :root {
      --navy: #0F141C;
      --pitch-navy: #1E293B;
      --gold: #E5A93C;

      --cream: #FFEEDA;
      --wave: #FFDEAD;

      --white: #FFFFFF;
      --muted: #475569;

      --heading: "Montserrat", sans-serif;
      --body: "Inter", sans-serif;

      --page-width: 480px;
    }


    /* =========================================================
       RESET
       ========================================================= */

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      margin: 0;

      background: var(--cream);
      color: var(--navy);

      font-family: var(--body);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    a {
      color: inherit;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }

    ::selection {
      background: var(--gold);
      color: var(--navy);
    }


    /* =========================================================
       PAGE SHELL
       ========================================================= */

    .page {
      position: relative;
      isolation: isolate;
      overflow: hidden;

      width: 100%;
      max-width: var(--page-width);
      min-height: 100svh;

      margin: 0 auto;
      padding:
        max(44px, env(safe-area-inset-top))
        22px
        max(30px, env(safe-area-inset-bottom));

      background: var(--cream);
    }


    /* =========================================================
       BERNA­BÉU-INSPIRED WATERMARK

       Same construction as the portfolio:
       • individual Bézier ribs
       • #FFDEAD only
       • gradient stroke
       • opacity mask
       • soft fade into #FFEEDA
       ========================================================= */

    .wave-art {
      position: absolute;
      z-index: -1;
      inset: 0;

      width: 100%;
      height: 100%;

      pointer-events: none;
    }

    .wave-art svg {
      display: block;

      width: 100%;
      height: 100%;
    }


    /* =========================================================
       PROFILE
       ========================================================= */

    .profile {
      display: flex;
      flex-direction: column;
      align-items: center;

      text-align: center;
    }

    .monogram {
      display: grid;
      place-items: center;

      width: 86px;
      height: 86px;

      margin-bottom: 24px;

      border: 2px solid var(--navy);
      border-radius: 50%;

      background: rgba(255, 238, 218, 0.74);

      font-family: var(--heading);
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.03em;

      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 8px;

      margin-bottom: 10px;

      font-family: var(--heading);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .eyebrow::before,
    .eyebrow::after {
      content: "";

      width: 18px;
      height: 2px;

      background: var(--gold);
    }

    h1 {
      max-width: 390px;

      margin: 0;

      font-family: var(--heading);
      font-size: clamp(1.85rem, 8vw, 2.35rem);
      font-weight: 800;
      line-height: 1.08;
      letter-spacing: -0.04em;
    }

    .bio {
      max-width: 380px;

      margin: 18px auto 0;

      color: var(--pitch-navy);

      font-size: 14px;
      line-height: 1.65;
    }


    /* =========================================================
       LINKS
       ========================================================= */

    .links {
      display: grid;
      gap: 12px;

      width: 100%;

      margin-top: 38px;
    }

    .link-button {
      position: relative;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;

      width: 100%;
      min-height: 62px;

      padding: 15px 18px 15px 20px;

      border: 1.5px solid var(--navy);
      border-radius: 6px;

      background: var(--navy);
      color: var(--white);

      font-family: var(--heading);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.055em;
      text-transform: uppercase;

      transition:
        background 160ms ease,
        color 160ms ease,
        border-color 160ms ease,
        transform 160ms ease;
    }

    .link-button:hover,
    .link-button:focus-visible {
      background: var(--gold);
      border-color: var(--gold);
      color: var(--navy);

      transform: translateY(-2px);
    }

    .link-icon {
      display: grid;
      place-items: center;

      flex: 0 0 32px;

      width: 32px;
      height: 32px;

      border: 1px solid rgba(255, 255, 255, 0.30);
      border-radius: 50%;

      font-family: var(--body);
      font-size: 17px;

      transition:
        transform 160ms ease,
        border-color 160ms ease;
    }

    .link-icon svg {
      display: block;
      flex-shrink: 0;
      color: currentColor;
    }

    .link-button:hover .link-icon,
    .link-button:focus-visible .link-icon {
      border-color: rgba(15, 20, 28, 0.35);
      transform: translate(2px, -2px);
    }


    /* =========================================================
       FOOTER
       ========================================================= */

    .page-footer {
      margin-top: 36px;

      text-align: center;
    }

    .footer-rule {
      width: 32px;
      height: 2px;

      margin: 0 auto 13px;

      background: var(--gold);
    }

    .page-footer p {
      margin: 0;

      color: var(--pitch-navy);

      font-family: var(--heading);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.10em;
      text-transform: uppercase;
    }


    /* =========================================================
       ACCESSIBILITY
       ========================================================= */

    a:focus-visible {
      outline: 3px solid var(--gold);
      outline-offset: 4px;
    }


    /* =========================================================
       DESKTOP PRESENTATION

       The page itself intentionally stays mobile-sized.
       ========================================================= */

    @media (min-width: 520px) {
      body {
        display: flex;
        justify-content: center;

        background: #f8f9ff;
      }

      .page {
        min-height: 100vh;

        box-shadow:
          0 0 0 1px rgba(15, 20, 28, 0.04),
          0 18px 60px rgba(15, 20, 28, 0.08);
      }
    }


    @media (max-height: 760px) {
      .page {
        padding-top: 30px;
      }

      .monogram {
        width: 72px;
        height: 72px;

        margin-bottom: 18px;

        font-size: 17px;
      }

      .bio {
        margin-top: 12px;
      }

      .links {
        margin-top: 26px;
        gap: 9px;
      }

      .link-button {
        min-height: 56px;
      }

      .page-footer {
        margin-top: 24px;
      }
    }


    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition-duration: 0.01ms !important;
      }
    }

  </style>
</head>
